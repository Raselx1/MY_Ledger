<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>My Ledger v7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{--bg:#f4f3f9;--bg2:#fff;--bg3:#f1f0f7;--border:#e7e5f0;--text:#16151f;--text2:#605d72;--text3:#9794a8;--accent:#6d3fea;--green:#1f9d63;--red:#e1453a;--yellow:#e08a1f;--blue:#2563eb;--purple:#6d3fea;--cyan:#0e9aa6;--shadow:0 1px 3px rgba(20,15,40,.06);--shadow-md:0 8px 24px rgba(20,15,40,.10)}
[data-theme="dark"]{--bg:#0d0c14;--bg2:#17151f;--bg3:#1d1b28;--border:#28253a;--text:#f2f1f8;--text2:#a8a5bb;--text3:#6c6884;--accent:#a17bff;--green:#3fd98a;--red:#ff6259;--yellow:#ffb648;--blue:#6e9bff;--purple:#a17bff;--cyan:#3fe0d6;--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 10px 28px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:transparent;padding:16px 16px 4px;position:relative;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.3px}
.logo span{color:var(--text3);font-weight:400;font-size:13px;margin-left:4px}
.hdr-date{font-size:12px;color:var(--text3);margin-top:1px}

/* WALLET CAROUSEL */
.wr{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.wr::-webkit-scrollbar{display:none}
.wc{flex-shrink:0;width:84%;max-width:340px;scroll-snap-align:start;border-radius:20px;padding:18px 18px 16px;cursor:pointer;position:relative;overflow:hidden;color:#fff;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 26px -6px rgba(20,15,40,.30)}
.wc::after{content:'';position:absolute;right:-36px;top:-36px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%,transparent 70%)}
.wc::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0px,rgba(255,255,255,.05) 1px,transparent 1px,transparent 14px);opacity:.5;pointer-events:none}
.wc-top,.wc-bal-lbl,.wc-b{position:relative;z-index:2}
.wc.t-bank{background:linear-gradient(135deg,#2451d6,#16317f)}
.wc.t-mfs{background:linear-gradient(135deg,#7b3fea,#43217f)}
.wc.t-cash{background:linear-gradient(135deg,#e0892a,#a3540f)}
.wc-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.wc-icon{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wc-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wc-n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-t{font-size:10px;opacity:.7;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.wc-bal-lbl{font-size:11px;opacity:.7;margin-bottom:2px;position:relative;z-index:1}
.wc-b{font-size:24px;font-weight:700;letter-spacing:-.5px;position:relative;z-index:1}
.wc-add{flex-shrink:0;width:56px;min-height:140px;border-radius:20px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);background:var(--bg3);scroll-snap-align:start}
.wdots{display:flex;justify-content:center;gap:5px;margin-bottom:2px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .25s}
.wdot.on{background:var(--accent);width:16px;border-radius:3px}

/* QUICK ACTIONS */
.qa-row{display:flex;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px 8px;margin-bottom:12px;box-shadow:var(--shadow)}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;cursor:pointer;background:none;border:none;font-family:inherit}
.qa-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qa-ic svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.qa-lbl{font-size:9.5px;color:var(--text2);font-weight:500;text-align:center;white-space:nowrap}
.qa1 .qa-ic{background:rgba(31,157,99,.13);color:var(--green)}
.qa2 .qa-ic{background:rgba(225,69,58,.13);color:var(--red)}
.qa3 .qa-ic{background:rgba(37,99,235,.13);color:var(--blue)}
.qa4 .qa-ic{background:rgba(224,138,31,.13);color:var(--yellow)}
.qa5 .qa-ic{background:rgba(109,63,234,.13);color:var(--purple)}

/* TXN ICON CIRCLE */
.txi{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txi svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.nav{display:flex;align-items:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:100;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.42));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,15,40,.14),0 1px 0 rgba(255,255,255,.85) inset}
[data-theme="dark"] .nav{background:linear-gradient(180deg,rgba(30,28,40,.62),rgba(20,18,28,.48));border-color:rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06) inset}
.nb{flex:1;padding:8px 2px 7px;background:none;border:none;border-radius:16px;color:var(--text3);font-size:9px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.nb.on{color:var(--accent);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55));box-shadow:0 2px 8px rgba(20,18,15,.10),0 1px 0 rgba(255,255,255,.9) inset}
[data-theme="dark"] .nb.on{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:0 2px 8px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.08) inset}
.nb{flex:1;padding:10px 2px 8px;background:none;border:none;border-top:2px solid transparent;color:var(--text3);font-size:9px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}
.nav-fab-slot{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.fab{position:relative;bottom:11px;width:50px;height:50px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:50%;border:3px solid var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(109,63,234,.45);z-index:99;transition:all .2s}
.fab:active{transform:scale(.94)}
.fab svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.fo{position:fixed;inset:0;z-index:97;display:none}
.fo.open{display:block}
.fm{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(8px);display:flex;flex-direction:row;gap:10px;z-index:98;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.fm.open{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0)}
.fi{display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.62));-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.6);border-radius:50%;cursor:pointer;box-shadow:0 6px 16px rgba(20,15,40,.16),0 1px 0 rgba(255,255,255,.7) inset;transition:all .2s}
[data-theme="dark"] .fi{background:linear-gradient(180deg,rgba(35,32,50,.88),rgba(25,23,38,.72));border-color:rgba(255,255,255,.10)}
.fi:active{transform:scale(.9)}
.fi-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi-ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fab.open svg{transform:rotate(45deg)}
.pg{padding:14px 14px 96px;display:none}
.pg.on{display:block;animation:pgIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sec{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:11px;padding:3px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sb{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px 12px 9px;box-shadow:var(--shadow);cursor:pointer;transition:all .18s}
.sb:active{transform:scale(.97)}
.sb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sb-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-ic svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.sb-l{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sb-v{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sb-s{font-size:9.5px;color:var(--text3);margin-top:2px}
.txn{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.txn-r{display:flex;justify-content:space-between;align-items:flex-start}
.txn-c{font-size:13px;font-weight:600}
.txn-m{font-size:11px;color:var(--text3);margin-top:2px}
.txn-n{font-size:11px;color:var(--text2);margin-top:2px}
.txn-a{font-size:15px;font-weight:700;text-align:right}
.txn-w{font-size:10px;color:var(--text3);text-align:right;margin-top:2px}
.txn-act{display:flex;gap:6px;margin-top:7px;justify-content:flex-end}
.bx{padding:3px 10px;border-radius:6px;border:1px solid var(--border);font-size:11px;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2);transition:all .15s}
.bxd{border-color:transparent;color:var(--red);background:transparent}
.bxp{border-color:var(--green);color:var(--green);background:transparent}
.dlbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:8px 2px 4px;display:flex;align-items:center;gap:8px}
.dlbl::after{content:'';flex:1;height:1px;background:var(--border)}
.ds{font-size:10px;font-weight:600;margin-left:auto;padding-right:2px}
.fp{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.fp::-webkit-scrollbar{display:none}
.fpill{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s;box-shadow:var(--shadow)}
.fpill.on{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;box-shadow:0 4px 12px rgba(109,63,234,.35)}
.hwc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.hwh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hwn{font-size:15px;font-weight:700}
.hwb{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.hws{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.hwst{background:var(--bg3);border-radius:8px;padding:7px 9px}
.hwst label{font-size:10px;color:var(--text3);display:block;margin-bottom:1px;font-weight:500}
.hwst .hv{font-size:13px;font-weight:600}
.prog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:4px}
.pf{height:100%;border-radius:3px;transition:width .5s}
.ir{display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-radius:6px;padding:6px 9px;margin-bottom:3px;font-size:12px}
.bp{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.bph{background:var(--bg3);padding:12px 14px 10px;border-bottom:1px solid var(--border)}
.bpi{font-size:22px;font-weight:700;color:var(--green);letter-spacing:-.3px}
.bps{height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:flex;margin:8px 0 4px}
.bpsf{height:100%;transition:width .5s}
.bpsl{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
.bpt{width:100%;border-collapse:collapse}
.bpt tr{border-bottom:1px solid var(--border)}
.bpt tr:last-child{border-bottom:none}
.bpt td{padding:9px 13px;font-size:13px}
.bpf{padding:9px 14px;background:var(--bg3)}
.bpfr{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.bpfr.tot{font-weight:700;font-size:14px;border-top:1px solid var(--border);margin-top:6px;padding-top:9px}
.mb{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;width:90px}
.mbf{height:100%;border-radius:3px}
.wb{font-size:12px;font-weight:500;padding:7px 11px;border-radius:8px;margin-bottom:6px}
.gc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.gch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.gcn{font-size:15px;font-weight:700}
.gcs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.gcst{background:var(--bg3);border-radius:8px;padding:7px 9px}
.gcst label{font-size:10px;color:var(--text3);display:block;margin-bottom:1px;font-weight:500}
.gcst .gv{font-size:13px;font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;padding:18px 16px 28px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;animation:su .22s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.mt{font-size:16px;font-weight:700;letter-spacing:-.2px}
.mc{width:28px;height:28px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fg{margin-bottom:12px}
.fl{font-size:11px;color:var(--text3);display:block;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.fi2{width:100%;padding:10px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s}
.fi2:focus{outline:none;border-color:var(--accent)}
textarea.fi2{resize:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.bp2{width:100%;padding:12px;background:var(--accent);border:none;border-radius:10px;color:var(--bg2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px}
.bs{width:100%;padding:10px;margin-top:7px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
.ncr{display:flex;gap:6px;margin-top:7px}
.ncr input{flex:1}
.ncr button{padding:9px 13px;background:var(--accent);border:none;border-radius:8px;color:var(--bg2);cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap}
.co{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.co.open{display:flex}
.cb{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:300px;width:100%;box-shadow:var(--shadow-md)}
.cb h3{font-size:16px;margin-bottom:6px}
.cb p{font-size:13px;color:var(--text2);margin-bottom:15px}
.cbs{display:flex;gap:8px}
.cd{flex:1;padding:11px;background:var(--red);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
.cc{flex:1;padding:11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-family:inherit;font-size:13px}
.do{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;align-items:flex-end;justify-content:center}
.do.open{display:flex}
.dp{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;animation:su .22s ease}
.dph{padding:14px 16px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.dpt{font-size:15px;font-weight:700}
.dpb{overflow-y:auto;padding:12px 16px 24px;flex:1}
.dr2{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.dr2:last-child{border-bottom:none}
.dr2 .dl{color:var(--text2)}
.dr2 .dv{font-weight:600}
.dtot{display:flex;justify-content:space-between;align-items:center;padding:11px 0 4px;font-size:15px;font-weight:700;border-top:1px solid var(--border);margin-top:4px}
.dsec{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:9px 0 4px}
.sts{margin-bottom:18px}
.sts-t{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding:0 2px}
.sti{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.sti-l{display:flex;align-items:center;gap:11px}
.sti-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(109,63,234,.13);color:var(--purple)}
.sti-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sti-l svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stl{font-size:14px;font-weight:600}
.stsub{font-size:11.5px;color:var(--text3);margin-top:1px}
.tgl{position:relative;width:44px;height:25px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:var(--border);border-radius:25px;cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.tsl:before{content:'';position:absolute;width:19px;height:19px;left:3px;bottom:3px;background:var(--bg2);border-radius:50%;transition:all .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 4px rgba(0,0,0,.15)}
input:checked+.tsl{background:linear-gradient(135deg,var(--accent),var(--purple))}
input:checked+.tsl:before{transform:translateX(19px)}
.lt{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px}
.lb{padding:6px 13px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}

.sta{width:100%;padding:13px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:11px;transition:all .18s;margin-bottom:8px;text-align:left;box-shadow:var(--shadow)}
.sta:active{transform:scale(.98)}
.sta-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sta-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hsc{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.hst{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.hsr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.hs2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hsr-v{padding:6px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.hsr-v:last-child{border-bottom:none}
.hsr-v-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hsr-v-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.hsr:last-child{border-bottom:none}
.h2c{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hb{background:var(--bg3);border-radius:8px;padding:9px 11px}
.hbl{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.hbv{font-size:16px;font-weight:700}
.tb{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;cursor:pointer;width:100%;margin-top:10px;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;box-shadow:var(--shadow)}
.tb:hover{border-color:var(--cyan);color:var(--cyan)}
.tb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb span{flex:1;text-align:left}
.emp{text-align:center;padding:32px 20px;color:var(--text3)}
.ei{width:52px;height:52px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--text3)}
.ei svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.emp p{font-size:13px;font-weight:500}
.mb2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mb2 input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;flex:1}
.it{display:flex;background:var(--bg3);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;border:1px solid var(--border)}
.itb{flex:1;padding:9px;border-radius:11px;border:none;background:transparent;color:var(--text3);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:all .2s}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);border-radius:8px;padding:8px 15px;font-size:12px;color:var(--bg2);z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;font-weight:500}
.toast.show{opacity:1}
</style>

function expData(){
  const json=JSON.stringify(DB,null,2);
  const filename=`myledger-${tod()}.json`;
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
    toast(t('exported'));
  }catch(err){
    // WebView (e.g. Appilix) fallback: open raw JSON in a new tab/window so it can be saved manually
    try{
      const w=window.open('','_blank');
      if(w){
        w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;font-family:monospace;padding:16px">'+json.replace(/</g,'&lt;')+'</pre>');
        w.document.title=filename;

      } else {
        toast(t('importFailed'));
      }
    }catch(e2){
      toast(t('importFailed'));
    }
  }
}
